name: Deploy to GCP

# Deploys the :stable image to the GCP host running venue-test, venue-1,
# venue-2 (three venues in a single JVM). Authenticates via Workload Identity
# Federation — no long-lived SSH key or service account key secrets needed.
#
# Required GitHub secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  WIF provider resource name
#   GCP_SERVICE_ACCOUNT             Service account email (needs compute.osLogin)
#
# The image is built by publish-docker.yml on pushes to master; this workflow
# only pulls and restarts the container. Host layout: deploy/gcp/README.md.

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Never cancel a mid-flight deploy; queue the newest instead
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
      id-token: write   # required for Workload Identity Federation

    env:
      GCP_INSTANCE: venue-test-instance-template-20250815-20250815-20260114-161153
      GCP_ZONE: asia-southeast1-b
      GCP_PROJECT: idyllic-pottery-468305-u2
      GCP_USER: deploy

    steps:
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT }}

    - name: Deploy to GCP VM
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gcloud compute ssh $GCP_USER@$GCP_INSTANCE \
          --zone=$GCP_ZONE \
          --project=$GCP_PROJECT \
          --strict-host-key-checking=no \
          --ssh-flag="-o ConnectTimeout=30" \
          -- bash -s -- "$GHCR_TOKEN" << 'DEPLOY_SCRIPT'
        set -euo pipefail
        GHCR_TOKEN="$1"
        # deploy user is not in the docker group by design — all docker and
        # /srv/covia operations go through (passwordless) sudo
        echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u github --password-stdin
        sudo docker pull ghcr.io/covia-ai/covia:stable
        # Bootstrap config if missing — three venues in one JVM, separate store
        # dirs so each gets its own identity key (venue.key next to etch file)
        if sudo test ! -f /srv/covia/config.json; then
          sudo mkdir -p /srv/covia/covia-test-data /srv/covia/covia-1-data /srv/covia/covia-2-data
          sudo tee /srv/covia/config.json > /dev/null << 'CONF'
        {
          "venues": [
            {
              "name": "Covia Test Venue",
              "hostname": "venue-test.covia.ai",
              "port": 8080,
              "store": "/data/covia-test-data/venue.etch",
              "mcp": {}
            },
            {
              "name": "Covia Venue 1 (Stable)",
              "hostname": "venue-1.covia.ai",
              "port": 8081,
              "store": "/data/covia-1-data/venue.etch",
              "mcp": {}
            },
            {
              "name": "Covia Venue 2 (Stable)",
              "hostname": "venue-2.covia.ai",
              "port": 8082,
              "store": "/data/covia-2-data/venue.etch",
              "mcp": {}
            }
          ]
        }
        CONF
          sudo chown -R 1001:1001 /srv/covia
        fi
        sudo docker stop covia-venue 2>/dev/null || true
        sudo docker rm covia-venue 2>/dev/null || true
        sudo docker run -d \
          --name covia-venue \
          -p 8080:8080 -p 8081:8081 -p 8082:8082 \
          -v /srv/covia:/data \
          --restart unless-stopped \
          --health-cmd='curl -f --max-time 3 http://localhost:8080/' \
          --health-interval=30s \
          --health-timeout=5s \
          --health-start-period=15s \
          --health-retries=3 \
          ghcr.io/covia-ai/covia:stable \
          java -Xmx2g -XX:+UseContainerSupport -XX:+UseG1GC -XX:+UseStringDeduplication \
               -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom \
               -Dfile.encoding=UTF-8 -jar covia.jar /data/config.json
        # Wait for healthy (start period is 15s; poll up to 60s)
        for i in $(seq 1 12); do
          status=$(sudo docker inspect --format='{{.State.Health.Status}}' covia-venue 2>/dev/null)
          [ "$status" = "healthy" ] && break
          [ $i -eq 12 ] && { echo "Container not healthy after 60s: $status"; exit 1; }
          sleep 5
        done
        # All three venues must answer or the deploy fails
        for P in 8080 8081 8082; do
          curl -sf --max-time 5 http://localhost:$P/api/v1/status > /dev/null || { echo "port $P NOT responding"; exit 1; }
          echo "port $P OK"
        done
        sudo docker image prune -f
        DEPLOY_SCRIPT
